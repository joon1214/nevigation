<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>충주대원고등학교 3D 배치도</title>
<style>
  :root {
    --bg:#f2f5fa;  --ink:#0f172a;  --ink2:#334155;  --muted:#94a3b8;
    --muted2:#64748b;  --line:#e7edf5;  --brand:#2563eb;  --soft:#f1f5f9;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--ink);
    font-family:"Pretendard","Pretendard Variable",-apple-system,BlinkMacSystemFont,
      "Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
    -webkit-font-smoothing:antialiased; }
  canvas { display:block; }

  /* ── floating control card ─────────────────────────────────── */
  #ui { position:absolute; z-index:20; top:24px; left:24px; width:314px;
    max-height:calc(100vh - 48px); overflow-y:auto; overscroll-behavior:contain;
    padding:22px 22px 18px; border-radius:20px; background:#fff;
    box-shadow:0 18px 48px rgba(15,23,42,.12), 0 2px 6px rgba(15,23,42,.05); }
  #ui::-webkit-scrollbar { width:6px; }
  #ui::-webkit-scrollbar-thumb { background:#dde5ef; border-radius:3px; }

  .eyebrow { font-size:12px; font-weight:800; color:var(--brand); letter-spacing:.2px; }
  #ui h1 { margin:6px 0 6px; font-size:25px; font-weight:800; letter-spacing:-.6px; }
  .sub { margin:0; font-size:12.5px; color:var(--muted); line-height:1.55; }

  .sect { margin-top:20px; }
  .cap { display:flex; justify-content:space-between; align-items:center;
    margin-bottom:10px; font-size:13px; font-weight:700; color:var(--muted2); }
  .cap.click { cursor:pointer; user-select:none; }
  .cap.click:hover { color:var(--brand); }
  .cap .chev { font-size:10px; color:var(--muted); transition:transform .18s; }
  .sect.closed .chev { transform:rotate(-90deg); }
  .sect.closed .body { display:none; }
  .help { margin:10px 2px 0; font-size:11.5px; line-height:1.6; color:var(--muted); }

  /* floor picker */
  .floor { display:flex; justify-content:space-between; align-items:center;
    width:100%; height:46px; margin-bottom:8px; padding:0 16px; font:inherit;
    border:1px solid var(--line); border-radius:13px; background:#fff;
    cursor:pointer; transition:.15s; }
  .floor:hover { border-color:#c6d8f2; background:#fafcff; }
  .floor .nm { font-size:15px; font-weight:600; color:var(--ink2); }
  .floor .ct { font-size:12.5px; color:var(--muted); }
  .floor.on { background:var(--brand); border-color:var(--brand);
    box-shadow:0 8px 18px rgba(37,99,235,.26); }
  .floor.on .nm { color:#fff; font-weight:700; }
  .floor.on .ct { color:rgba(255,255,255,.78); }

  /* route finder */
  .row { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .dot { width:9px; height:9px; border-radius:50%; flex:0 0 auto; }
  #ui input[type=text] { flex:1; min-width:0; height:40px; padding:0 12px;
    font:inherit; font-size:13.5px; color:var(--ink); background:#fbfcfe;
    border:1px solid var(--line); border-radius:11px; }
  #ui input[type=text]::placeholder { color:#a9b6c8; }
  #ui input[type=text]:focus { outline:none; background:#fff; border-color:#93b4ea;
    box-shadow:0 0 0 4px rgba(37,99,235,.10); }
  #swap { width:40px; height:40px; flex:0 0 auto; font:inherit; font-size:14px;
    color:var(--muted2); background:#fff; border:1px solid var(--line);
    border-radius:11px; cursor:pointer; }
  #swap:hover { color:var(--brand); border-color:#c6d8f2; }

  .acts { display:flex; gap:8px; margin-top:10px; }
  .btn { flex:1; height:42px; font:inherit; font-size:14px; font-weight:700;
    color:var(--ink2); background:#fff; border:1px solid var(--line);
    border-radius:12px; cursor:pointer; transition:.15s; }
  .btn:hover { background:#f7fafe; border-color:#c6d8f2; }
  .btn.pri { color:#fff; background:var(--brand); border-color:var(--brand);
    box-shadow:0 8px 18px rgba(37,99,235,.26); }
  .btn.pri:hover { background:#1d55d0; }

  /* switches */
  .opt { display:flex; align-items:center; justify-content:space-between;
    padding:7px 0; font-size:13px; color:var(--ink2); cursor:pointer; }
  .opt input { display:none; }
  .opt .sw { position:relative; width:36px; height:20px; flex:0 0 auto;
    border-radius:99px; background:#dde5ef; transition:.18s; }
  .opt .sw::after { content:""; position:absolute; top:2px; left:2px;
    width:16px; height:16px; border-radius:50%; background:#fff;
    box-shadow:0 1px 3px rgba(15,23,42,.28); transition:.18s; }
  .opt input:checked + .sw { background:var(--brand); }
  .opt input:checked + .sw::after { transform:translateX(16px); }

  /* building chips */
  .chips { display:flex; flex-wrap:wrap; gap:7px; }
  .chip { padding:7px 12px; font:inherit; font-size:12.5px; font-weight:600;
    color:var(--ink2); background:#fff; border:1px solid var(--line);
    border-radius:99px; cursor:pointer; transition:.15s; }
  .chip:hover { color:var(--brand); background:#eff5ff; border-color:#bcd3f7; }

  /* legend */
  .legend { display:grid; grid-template-columns:1fr 1fr; gap:10px 10px; }
  .lg { display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--muted2); }
  .lg i { width:14px; height:14px; flex:0 0 auto; border-radius:4px;
    border:1px solid rgba(15,23,42,.08); }

  /* picked-facility box */
  #hint { margin-top:18px; padding:14px 15px; border-radius:13px; background:var(--soft);
    font-size:12.5px; line-height:1.55; color:var(--muted2); }
  #hint .nm { margin-bottom:3px; font-size:15px; font-weight:800; color:var(--ink); }
  #hint .meta { font-size:12px; color:var(--muted); }
  #hint .pa { display:flex; gap:7px; margin-top:11px; }
  #hint .pa button { flex:1; height:34px; font:inherit; font-size:12.5px; font-weight:700;
    color:var(--ink2); background:#fff; border:1px solid #dde5ef; border-radius:9px;
    cursor:pointer; }
  #hint .pa button:hover { color:var(--brand); border-color:#bcd3f7; }

  /* route steps */
  #steps { display:none; margin-top:12px; font-size:12px; line-height:1.6; color:var(--muted2); }
  #steps .sum { margin-bottom:8px; font-size:12.5px; font-weight:700; color:var(--brand); }
  #steps ol { margin:0; padding-left:17px; }
  #steps li { margin:4px 0; }
  #steps b { color:var(--ink2); }
  #steps .warn { font-weight:600; color:#dc2626; }
  #steps .note { margin-bottom:8px; padding:6px 9px; border-radius:8px;
    background:#fff7ed; color:#b45309; font-size:11.5px; }

  /* ── in-scene labels ───────────────────────────────────────── */
  .lbl { pointer-events:none; white-space:nowrap; font-family:inherit; }
  .lbl.bldg { padding:4px 10px; font-size:12px; font-weight:700; color:#1e293b;
    background:#fff; border:1px solid #e2e8f0; border-radius:8px;
    box-shadow:0 4px 12px rgba(15,23,42,.10); transition:.18s; }
  .lbl.bldg.on { color:var(--brand); border-color:#bcd3f7;
    box-shadow:0 6px 16px rgba(37,99,235,.20); }
  .lbl.site { padding:3px 9px; font-size:11.5px; font-weight:600; color:#475569;
    background:#fff; border:1px solid #e6ecf4; border-radius:7px;
    box-shadow:0 3px 9px rgba(15,23,42,.07); }
  .lbl.room { padding:2px 6px; font-size:9.5px; font-weight:600; color:#64748b;
    background:rgba(255,255,255,.92); border:1px solid #eaeff6; border-radius:5px; }
  .lbl.pin { padding:4px 11px; font-size:12px; font-weight:800; color:#fff;
    border-radius:8px; box-shadow:0 6px 16px rgba(15,23,42,.22); }
  .lbl.pin.start { background:#16a34a; }
  .lbl.pin.end   { background:#dc2626; }

  @media (max-width:640px) {
    #ui { top:12px; left:12px; right:12px; width:auto; padding:18px;
      max-height:52vh; border-radius:16px; }
    #ui h1 { font-size:21px; }
  }
</style>
</head>
<body>

<div id="ui">
  <div class="eyebrow">충주대원고등학교</div>
  <h1>3D 실내 지도</h1>
  <p class="sub">드래그로 회전 · 휠로 확대/축소</p>

  <div class="sect">
    <div class="cap">본관 층 선택</div>
    <div class="body">
      <div id="floors"></div>
      <p class="help">층을 선택하면 나머지 층과 다른 건물은 반투명하게 표시됩니다.</p>
    </div>
  </div>

  <div class="sect" id="secNav">
    <div class="cap click">길찾기 <span class="chev">▾</span></div>
    <div class="body">
      <div class="row">
        <span class="dot" style="background:#16a34a"></span>
        <input type="text" id="fromIn" list="places" placeholder="출발지 (예: 3-1)" autocomplete="off">
      </div>
      <div class="row">
        <span class="dot" style="background:#dc2626"></span>
        <input type="text" id="toIn" list="places" placeholder="도착지 (예: 급식실)" autocomplete="off">
        <button id="swap" title="출발지·도착지 바꾸기">⇅</button>
      </div>
      <datalist id="places"></datalist>

      <label class="opt"><span>계단 없는 경로 (엘리베이터)</span>
        <input type="checkbox" id="stepFree"><span class="sw"></span></label>
      <label class="opt"><span>기숙사 경유 허용</span>
        <input type="checkbox" id="viaDorm"><span class="sw"></span></label>

      <div class="acts">
        <button class="btn pri" id="go">길찾기</button>
        <button class="btn" id="clear">지우기</button>
      </div>

      <div id="steps"></div>
    </div>
  </div>

  <div class="sect closed" id="secFocus">
    <div class="cap click">건물 보기 <span class="chev">▾</span></div>
    <div class="body"><div class="chips" id="focus"></div></div>
  </div>

  <div class="sect closed" id="secOpt">
    <div class="cap click">표시 옵션 <span class="chev">▾</span></div>
    <div class="body">
      <label class="opt"><span>교실 이름</span>
        <input type="checkbox" id="showRooms" checked><span class="sw"></span></label>
      <label class="opt"><span>부지 시설</span>
        <input type="checkbox" id="showSite" checked><span class="sw"></span></label>
      <label class="opt"><span>경로 볼 때 건물 투시</span>
        <input type="checkbox" id="xray" checked><span class="sw"></span></label>
    </div>
  </div>

  <div class="sect">
    <div class="legend">
      <div class="lg"><i style="background:#dce8f8"></i>교실</div>
      <div class="lg"><i style="background:#f2f7fd"></i>복도</div>
      <div class="lg"><i style="background:#a8bcd8"></i>계단</div>
      <div class="lg"><i style="background:#6d85ac"></i>엘리베이터</div>
      <div class="lg"><i style="background:#c4d4ea"></i>화장실</div>
      <div class="lg"><i style="background:#2563eb"></i>선택됨</div>
    </div>
  </div>

  <div id="hint">시설 상자를 클릭해 보세요</div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

/* ══════════════════════════════════════════════════════════════════
   SCENE
   ══════════════════════════════════════════════════════════════════ */
const BG = 0xf2f5fa;                       // 카드 UI와 같은 밝은 회청색 배경

const scene = new THREE.Scene();
scene.background = new THREE.Color(BG);
scene.fog = new THREE.Fog(BG, 260, 620);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.5, 1600);
// 왼쪽 카드에 가리지 않도록 시선 중심을 서쪽으로 조금 밀어 캠퍼스를 오른쪽에 앉힌다
camera.position.set(-10, 92, 126);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
// CSS2DRenderer 는 라벨마다 z-index 를 직접 매긴다. 컨테이너에 z-index 를 주어
// 별도 쌓임 맥락으로 가둬야 라벨이 조작 카드 위로 튀어나오지 않는다.
Object.assign(labelRenderer.domElement.style,
  { position: 'absolute', top: '0', zIndex: '1', pointerEvents: 'none' });
document.body.appendChild(labelRenderer.domElement);

// controls MUST bind to the WebGL canvas - the label layer is pointer-events:none
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(-10, 6, 4);
controls.enableDamping = true;
controls.dampingFactor = 0.075;
controls.maxPolarAngle = Math.PI * 0.487;
controls.minDistance = 22;
controls.maxDistance = 340;

/* 그림자 없이 부드러운 확산광만 쓴다 — 종이에 인쇄한 도면처럼 밝고 납작하게
   보여야 하얀 상자들의 경계선(EdgesGeometry)이 디자인의 주인공이 된다. */
scene.add(new THREE.AmbientLight(0xffffff, 1.42));
scene.add(new THREE.HemisphereLight(0xffffff, 0xdde6f2, 0.80));
const keyLight = new THREE.DirectionalLight(0xffffff, 0.92);
keyLight.position.set(64, 130, 74);
scene.add(keyLight);
const fill = new THREE.DirectionalLight(0xe8eefa, 0.42);
fill.position.set(-72, 78, -64);
scene.add(fill);

/* ══════════════════════════════════════════════════════════════════
   PALETTE
   비상대피도의 알록달록한 원색 대신, 범례에 있는 다섯 가지 톤으로만 칠한다.
   방의 "종류"를 색으로 나누되 채도를 거의 없애서 흰 종이 모형처럼 보이게 하고,
   강조(선택·경로)에만 브랜드 블루를 남겨 시선이 한 곳으로 모이게 한다.
   기존 셀 정의(C.g1, C.office …)를 그대로 쓰기 위해 키는 유지하고 값만 묶는다.
   ══════════════════════════════════════════════════════════════════ */
const TONE = {
  room:   0xdce8f8,   // 교실 · 일반 실 (연한 파랑)
  corr:   0xf2f7fd,   // 복도 · 현관 (거의 흰색)
  stair:  0xa8bcd8,   // 계단 (중간 슬레이트)
  elev:   0x6d85ac,   // 엘리베이터 (짙은 남색)
  wc:     0xc4d4ea,   // 화장실
  pad:    0xfbfcfe,   // 부지 시설 슬래브
  sel:    0x2563eb,   // 선택됨
};
const EDGE    = 0x9db4d4;   // 상자 외곽선
const EDGE_OP = 0.5;

const C = {
  g1:      TONE.room,  g2:      TONE.room,  g3:      TONE.room,
  office:  TONE.room,  lab:     TONE.room,  special: TONE.room,
  wc:      TONE.wc,    stair:   TONE.stair, elev:    TONE.elev,
  entry:   TONE.corr,  food:    TONE.room,  dorm:    TONE.room,
  study:   TONE.room,  library: TONE.room,  store:   TONE.corr,
  gym:     TONE.room,  corr:    TONE.corr,
  agora:   TONE.room,  // 아고라는 통로이면서 교실이므로 교실 색을 쓴다
  // 담곡관 — 원본 지도에서만 다른 색조였던 칸들도 같은 규칙으로 흡수한다
  dgHall:  TONE.room,  dgRoom:  TONE.room,  dgWcF:   TONE.wc,
  dgWc:    TONE.wc,    dgWhite: TONE.corr,
};

const FLOOR_H = 4.3;                    // one storey, world units
const GAP     = 0.16;                   // gap between adjacent room cells

/* ══════════════════════════════════════════════════════════════════
   BUILDERS
   ══════════════════════════════════════════════════════════════════ */
/* 모든 상자·외곽선·라벨을 한 배열에 등록해 두고, 층 강조·투시·선택을 그때그때
   다시 계산해 한 번에 반영한다(refresh). 여러 곳에서 opacity 를 각자 만지면
   서로 덮어써서 상태가 어긋나기 때문에 표현은 이 한 곳으로 모은다. */
const parts       = [];   // { o, type:'mesh'|'edge'|'label', key, floor, base, tone }
const roomLabels  = [];
const siteObjects = [];
const pickables   = [];   // 클릭으로 고를 수 있는 방 상자
const partOf      = new WeakMap();
const bldgLabels  = {};   // 건물키 -> 건물 이름표 element
const focusTargets = {};

function reg(o, type, key, floor, base, tone) {
  const p = { o, type, key, floor, base, tone, sel: false };
  parts.push(p);
  return p;
}

/* 층 강조·투시로 흐려질 수 있는 표면은 처음부터 transparent 로 만든다.
   three.js 는 `transparent` 를 나중에 켜면 셰이더를 다시 컴파일해야 반영되는데
   (플래그만 바꾸면 계속 불투명하게 그려진다), 수백 개를 한꺼번에 다시 컴파일하면
   전환할 때마다 화면이 멈춘다. opacity 만 오르내리게 두면 그럴 일이 없다. */
function surface(color, roughness = 0.95) {
  return new THREE.MeshStandardMaterial({
    color, roughness, metalness: 0, transparent: true, opacity: 1,
  });
}

/* Every room cell also becomes a node in the walking graph used by 길찾기.
   `along` is the cell's position on its floor bar, so cells can be chained in
   corridor order; `kind` decides how the node may be linked vertically. */
const navCells = [];
function classify(n) {
  if (n.includes('계단')) return 'stair';
  if (n.includes('ELEV')) return 'elev';
  if (n.includes('현관')) return 'entry';
  return 'room';
}

function makeLabel(text, cls) {
  const el = document.createElement('div');
  el.className = 'lbl ' + cls;
  el.textContent = text;
  return new CSS2DObject(el);
}

/* Distribute cells across `span`, honouring relative weights, so every floor
   of a building keeps the SAME overall footprint no matter how many rooms it
   holds. Returns [{...cell, size, centre}]. */
function layout(cells, span) {
  const total = cells.reduce((s, c) => s + (c.w ?? 1), 0);
  let cursor = -span / 2;
  return cells.map(c => {
    const size = ((c.w ?? 1) / total) * span;
    const centre = cursor + size / 2;
    cursor += size;
    return { ...c, size, centre };
  });
}

/**
 * A multi-storey building drawn as a grid of individual room boxes.
 * @param cfg.at     [x, z] footprint centre
 * @param cfg.axis   'x' rooms run east-west | 'z' rooms run north-south
 * @param cfg.len    footprint length along `axis`
 * @param cfg.depth  footprint depth across `axis`
 * @param cfg.floors [{ cells:[{n,w,c}], span?, align? }]  index 0 = 1층
 */
function makeBuilding(cfg) {
  const { at: [ox, oz], axis, len, depth, floors, name, labelY } = cfg;
  const lf = cfg.labelFace ?? 1;      // 1 = south/east face, -1 = north/west face
  const key = cfg.key ?? name;        // stable id used by the navigation graph
  const root = new THREE.Group();
  root.position.set(ox, 0, oz);
  scene.add(root);

  floors.forEach((fl, fi) => {
    const y = fi * FLOOR_H;
    // a partial floor (e.g. 후관 3층) covers only part of the footprint
    const span = (fl.span ?? 1) * len;
    const shift = fl.align === 'start' ? -(len - span) / 2
                : fl.align === 'end'   ?  (len - span) / 2 : 0;

    layout(fl.cells, span).forEach((cell, ci) => {
      const along = cell.size - GAP;
      const w = axis === 'x' ? along : depth;
      const d = axis === 'x' ? depth : along;

      const tone = cell.c ?? C.office;
      const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(w, FLOOR_H - GAP, d), surface(tone)
      );
      const px = axis === 'x' ? cell.centre + shift : 0;
      const pz = axis === 'x' ? 0 : cell.centre + shift;
      mesh.position.set(px, y + (FLOOR_H - GAP) / 2, pz);
      root.add(mesh);
      const part = reg(mesh, 'mesh', key, fi, 1, tone);

      const outline = new THREE.LineSegments(
        new THREE.EdgesGeometry(mesh.geometry),
        new THREE.LineBasicMaterial({ color: EDGE, transparent: true, opacity: EDGE_OP })
      );
      outline.position.copy(mesh.position);
      root.add(outline);
      reg(outline, 'edge', key, fi, EDGE_OP);

      // room caption, floated just outside the sunny (south / east) face
      const cap = makeLabel(cell.n, 'room');
      cap.position.set(
        axis === 'x' ? px : lf * (depth / 2 + 0.6),
        y + FLOOR_H * 0.55,
        axis === 'x' ? lf * (depth / 2 + 0.6) : pz
      );
      root.add(cap);
      reg(cap, 'label', key, fi, 1);
      roomLabels.push(cap);

      const node = key ? {
        id: `${key}#${fi}#${ci}`,
        room: cell.n,
        bldg: cfg.navName ?? name ?? key,
        key, floor: fi,
        along: cell.centre + shift,
        kind: classify(cell.n),
        pos: new THREE.Vector3(ox + px, y + 1.6, oz + pz),
      } : null;
      if (node) navCells.push(node);

      mesh.userData.node = node;
      partOf.set(mesh, part);
      pickables.push(mesh);
    });
  });

  if (name) {
    // 화면에는 번호를 떼고 이름만 — 번호는 길찾기 목록 정렬에만 쓰인다
    const tag = makeLabel(name.replace(/^\d+\.\s*/, ''), 'bldg');
    tag.position.set(0, labelY ?? floors.length * FLOOR_H + 3.2, 0);
    root.add(tag);
    // 담곡관처럼 한 건물을 여러 블록으로 나눠 지은 곳도 이름표는 하나이므로,
    // 블록 키가 아니라 길찾기에서 쓰는 건물 이름으로 등록한다.
    bldgLabels[cfg.navName ?? name] = tag.element;
  }
  focusTargets[name] = new THREE.Vector3(ox, floors.length * FLOOR_H / 2, oz);
  return root;
}

/** A corridor / bridge floating at a fixed storey band.
 *  `labelZ` 는 이름표만 통로 축을 따라 옮긴다 — 통로 한가운데가 다른 건물 뒤로
 *  숨어 이름표끼리 겹칠 때 쓴다. */
function bridge({ at: [x, z], w, d, floor, storeys = 1, color = C.corr, name, labelZ = 0 }) {
  const h = storeys * FLOOR_H - GAP;
  const yBase = floor * FLOOR_H;          // `floor` may be fractional (e.g. 2.5층)
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), surface(color));
  mesh.position.set(x, yBase + h / 2, z);
  scene.add(mesh);
  partOf.set(mesh, reg(mesh, 'mesh', 'link', floor, 1, color));
  const edge = new THREE.LineSegments(
    new THREE.EdgesGeometry(mesh.geometry),
    new THREE.LineBasicMaterial({ color: EDGE, transparent: true, opacity: EDGE_OP })
  );
  edge.position.copy(mesh.position);
  scene.add(edge);
  reg(edge, 'edge', 'link', floor, EDGE_OP);
  if (name) {
    const t = makeLabel(name, 'site');
    t.position.set(x, yBase + h + 1.2, z + labelZ);
    scene.add(t);
  }
  return mesh;
}

/** A ramped bridge tying two DIFFERENT storeys together. */
function ramp({ x, w, from: [z1, y1], to: [z2, y2], thick = 2.3, color = C.corr, name }) {
  const dz = z2 - z1, dy = y2 - y1;
  const len = Math.hypot(dz, dy);
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, thick, len), surface(color));
  mesh.rotation.x = -Math.atan2(dy, dz);
  mesh.position.set(x, (y1 + y2) / 2, (z1 + z2) / 2);
  scene.add(mesh);
  partOf.set(mesh, reg(mesh, 'mesh', 'link', 2, 1, color));
  const o = new THREE.LineSegments(new THREE.EdgesGeometry(mesh.geometry),
    new THREE.LineBasicMaterial({ color: EDGE, transparent: true, opacity: EDGE_OP }));
  o.position.copy(mesh.position); o.rotation.copy(mesh.rotation);
  scene.add(o);
  reg(o, 'edge', 'link', 2, EDGE_OP);
  if (name) { const t = makeLabel(name, 'site'); t.position.set(x, Math.max(y1, y2) + 2, (z1 + z2) / 2); scene.add(t); }
  return mesh;
}

/**
 * A volume that juts OUT of a building's flank on one storey — the map draws
 * these as small blocks hanging off the main bar (본관의 화장실·숙직실 띠,
 * 별관의 화장실). `cells` are laid out along `axis` exactly like a floor.
 */
function annex({ at: [x, z], axis, len, depth, floor, cells, labelFace = 1,
                 attachTo, bldg }) {
  const h = FLOOR_H - GAP;
  const y = floor * FLOOR_H + h / 2;

  layout(cells, len).forEach((cell, ci) => {
    const along = cell.size - GAP;
    const w = axis === 'x' ? along : depth;
    const d = axis === 'x' ? depth : along;
    const px = axis === 'x' ? x + cell.centre : x;
    const pz = axis === 'x' ? z : z + cell.centre;

    const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), surface(cell.c));
    mesh.position.set(px, y, pz);
    scene.add(mesh);
    const part = reg(mesh, 'mesh', attachTo, floor, 1, cell.c);

    const edge = new THREE.LineSegments(
      new THREE.EdgesGeometry(mesh.geometry),
      new THREE.LineBasicMaterial({ color: EDGE, transparent: true, opacity: EDGE_OP })
    );
    edge.position.copy(mesh.position);
    scene.add(edge);
    reg(edge, 'edge', attachTo, floor, EDGE_OP);

    const cap = makeLabel(cell.n, 'room');
    cap.position.set(
      axis === 'x' ? px : px + labelFace * (depth / 2 + 0.6),
      y + h * 0.15,
      axis === 'x' ? z + labelFace * (depth / 2 + 0.6) : pz
    );
    scene.add(cap);
    reg(cap, 'label', attachTo, floor, 1);
    roomLabels.push(cap);

    const node = attachTo ? {
      id: `${attachTo}-annex#${floor}#${ci}#${cell.n}`,
      room: cell.n, bldg, key: attachTo, floor,
      along: null,                       // hangs off the bar - linked by proximity
      kind: classify(cell.n), attached: true,
      pos: new THREE.Vector3(px, y, pz),
    } : null;
    if (node) navCells.push(node);

    mesh.userData.node = node;
    partOf.set(mesh, part);
    pickables.push(mesh);
  });
}

/**
 * Ground feature (playground, car park, court …).
 * 원본의 흙·아스팔트 색 대신 건물과 같은 흰 슬래브로 얇게 세워, 배치도 전체가
 * 한 벌의 종이 모형처럼 보이게 한다. `color` 는 호출부 호환을 위해 남겨 두되
 * 실제 색은 팔레트가 정한다. `y` 는 원래 겹친 평면끼리의 z-파이팅을 피하려던
 * 값이므로, 입체가 된 지금은 "조회대처럼 다른 슬래브 위에 얹히는 것"이라는
 * 뜻으로만 읽어 높이를 키운다 — 띄우면 허공에 뜬 타일처럼 보인다.
 */
const PAD_H = 0.55;
function pad({ at: [x, z], w, d, color, name, y = 0.05 }) {
  const h = y > 0.06 ? PAD_H * 1.7 : PAD_H;
  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(w, h, d),
    new THREE.MeshStandardMaterial({ color: TONE.pad, roughness: 1, metalness: 0 })
  );
  mesh.position.set(x, h / 2, z);
  scene.add(mesh);
  siteObjects.push(mesh);

  const edge = new THREE.LineSegments(
    new THREE.EdgesGeometry(mesh.geometry),
    new THREE.LineBasicMaterial({ color: EDGE, transparent: true, opacity: EDGE_OP })
  );
  edge.position.copy(mesh.position);
  scene.add(edge);
  siteObjects.push(edge);

  if (name) {
    const t = makeLabel(name, 'site');
    t.position.set(x, h + 0.6, z);
    scene.add(t);
    siteObjects.push(t);
  }
  return mesh;
}

   건물이 종이 위에 놓인 모형처럼 읽히게 한다. */
{
  const g = new THREE.Mesh(
    new THREE.PlaneGeometry(560, 460),

  );

  grid.material.transparent = true;
  grid.material.opacity = 0.9;
  grid.material.depthWrite = false;
  scene.add(grid);
}

/* 본관 북쪽으로 튀어나온 부속동.
   지도에서 중앙 계단과 승강기는 층마다 되풀이해 표기되어 있다 — 즉 1층부터
   4층까지 관통하는 수직 동선이다. 그래서 이 둘은 부속 띠에서 떼어내 층층이 쌓는
   탑으로 만들고, 나머지 부속실(화장실·숙직실)은 그 사이사이에 붙인다.
   기준 x는 본관 셀에서 직접 읽어 오므로, 본관 칸 비율을 바꿔도 따라 움직인다. */
{
  const STRIP_Z = 4 - 7 / 2 - 1.4;          // 본관 북쪽 면 바깥
  const STRIP_D = 2.8;
  const STAIR_W = 3.7, WC_W = 8, ELEV_W = 3.0;
  const hallX = navCells.find(c => c.key === 'main' && c.room === '중앙현관').pos.x;

  // 서쪽에서 동쪽으로: 화장실(남)·숙직실 | 계단탑 | 화장실(여) | 승강기탑
  const stairW = hallX - STAIR_W / 2;
  const stairE = hallX + STAIR_W / 2;
  const elevX  = stairE + WC_W + ELEV_W / 2;

  annex({
    at: [stairW - WC_W / 2, STRIP_Z], axis: 'x', len: WC_W, depth: STRIP_D, floor: 0,
    labelFace: -1, attachTo: 'main', bldg: '1. 본관',
    cells: [
      { n:'화장실(남)', w:1.3, c:C.wc },
      { n:'숙직실',     w:1.0, c:C.office },
    ],
  });

  annex({
    at: [stairE + WC_W / 2, STRIP_Z], axis: 'x', len: WC_W, depth: STRIP_D, floor: 0,
    labelFace: -1, attachTo: 'main', bldg: '1. 본관',
    cells: [ { n:'화장실(여)', c:C.wc } ],
  });

  // 수직 동선 두 개 — 1층부터 4층까지 같은 자리에 층층이 쌓는다
  [
    { x: hallX, w: STAIR_W, n: '계단',  c: C.stair },
    { x: elevX, w: ELEV_W,  n: 'ELEV.', c: C.elev  },
  ].forEach(tower => [0, 1, 2, 3].forEach(floor => annex({
    at: [tower.x, STRIP_Z], axis: 'x', len: tower.w, depth: STRIP_D, floor,
    labelFace: -1, attachTo: 'main', bldg: '1. 본관',
    cells: [ { n: tower.n, c: tower.c } ],
  })));
}

/* ══════════════════════════════════════════════════════════════════

     · 연결복도 · 아고라   → 건물 간 수동 연결
     · 야외 보행로         → 건물 출입구를 잇는 별도 노드망

  ['out-lib',    '도서관 앞',  16, -33],
  ['out-back',   '후문',      -40, -28],
];
const OUT_LINKS = [
  ['out-field','out-main-s'], ['out-field','out-court'], ['out-field','out-gym'],
  ['out-field','out-gate'],   ['out-court','out-gym'],   ['out-court','out-gate'],
  ['out-main-s','out-main-w'],['out-main-s','out-main-e'],['out-main-e','out-dg'],
  ['out-gate','out-dg'],      ['out-main-w','out-annex'], ['out-annex','out-gym'],
  ['out-main-w','out-rear-w'],['out-rear-w','out-rear-n'],['out-rear-n','out-rear-e'],
  ['out-rear-e','out-main-e'],['out-rear-n','out-lib'],   ['out-rear-w','out-back'],
];

const nodes = new Map();     // id -> node
const adj   = new Map();     // id -> [{to, w, via}]   via: 'stair' | 'elev' | null

navCells.forEach(c => nodes.set(c.id, c));
OUTDOOR.forEach(([id, label, x, z]) => nodes.set(id,
  { id, room: label, bldg: '야외', floor: 0, kind: 'outdoor',
    pos: new THREE.Vector3(x, OUT_Y, z) }));
CONNECTORS.forEach(c => nodes.set(c.id,
  { id: c.id, room: c.label, bldg: c.where ?? '연결통로', floor: 2, kind: 'connector',
    pos: new THREE.Vector3(...c.node) }));

/* 기숙사는 생활 공간이라 지나다니는 통로가 아니다. 간선 자체는 그대로 두고
   탐색할 때 큰 가중치를 얹어, 우회로가 있으면 알아서 피하고 기숙사가 출발지나
   도착지일 때는 정상적으로 도달하게 한다. 가중치를 링크 단계가 아니라 탐색
   단계에서 매기므로 사용자가 "기숙사 경유"를 켜고 끌 수 있다. */
const RESTRICTED_COST = 30;
navCells.forEach(c => { if (c.room.includes('기숙사')) c.restricted = true; });

/* 층을 오르내리는 간선에는 그 수단(계단/승강기)을 적어 둔다. 노드의 종류로
   판단하면 안 된다 — 복도를 걷다 계단 칸 "앞을" 지나가는 것과 계단을 실제로
   오르내리는 것은 다르기 때문이다. 수단을 간선에 적어 두면 탐색할 때
   "계단은 빼고" 또는 "승강기는 빼고" 를 정확히 고를 수 있다. */
function link(a, b, mult = 1, via = null) {
  const A = nodes.get(a), B = nodes.get(b);
  if (!A || !B || a === b) return;
  const w = A.pos.distanceTo(B.pos) * mult;
  if (!adj.has(a)) adj.set(a, []);
  if (!adj.has(b)) adj.set(b, []);
  adj.get(a).push({ to: b, w, via });
  adj.get(b).push({ to: a, w, via });
}

// ── 1. 같은 층 복도: along 순서로 이웃끼리 사슬 연결
const bars = new Map();
navCells.filter(c => !c.attached).forEach(c => {
  const k = `${c.key}#${c.floor}`;
  if (!bars.has(k)) bars.set(k, []);
  bars.get(k).push(c);
});
bars.forEach(list => {
  list.sort((a, b) => a.along - b.along);
  for (let i = 1; i < list.length; i++) link(list[i - 1].id, list[i].id);
});

// ── 2. 돌출 부속실: 같은 건물·같은 층에서 가장 가까운 칸에 붙인다
navCells.filter(c => c.attached).forEach(c => {
  let best = null, bestD = Infinity;
  bars.get(`${c.key}#${c.floor}`)?.forEach(o => {
    const d = c.pos.distanceTo(o.pos);
    if (d < bestD) { bestD = d; best = o; }
  });
  if (best) link(c.id, best.id);
});

// ── 3. 계단·승강기: 위아래 층의 같은 위치끼리 (수직 이동은 가중치 2.4배)
//      along 이 없는 돌출 부속실은 여기서 제외한다 (아래 3c 에서 따로 처리)
navCells.filter(c => (c.kind === 'stair' || c.kind === 'elev') && c.along !== null)
  .forEach(c => {
    bars.get(`${c.key}#${c.floor + 1}`)?.forEach(o => {
      if (o.kind === c.kind && Math.abs(o.along - c.along) < 2.5)
        link(c.id, o.id, 2.4, c.kind);
    });
  });

// ── 3c. 층층이 쌓아 올린 돌출 계단탑(본관 중앙 계단)을 위아래로 잇는다.
//        화장실처럼 계단이 아닌 부속실은 겹쳐 있어도 이어서는 안 된다.
const annexCells = navCells.filter(c => c.attached);
annexCells.forEach(a => {
  if (a.kind !== 'stair' && a.kind !== 'elev') return;
  annexCells.forEach(b => {
    if (b.floor !== a.floor + 1 || b.kind !== a.kind) return;
    if (Math.hypot(a.pos.x - b.pos.x, a.pos.z - b.pos.z) > 1.5) return;
    link(a.id, b.id, 2.4, a.kind);
  });
});

function nearestCell(key, floor, x, z) {
  let best = null, bestD = Infinity;
  (bars.get(`${key}#${floor}`) ?? []).forEach(c => {
    const d = (c.pos.x - x) ** 2 + (c.pos.z - z) ** 2;
    if (d < bestD) { bestD = d; best = c; }
  });
  return best;
}
const linkedTo = (cell, key, floor) => (adj.get(cell.id) ?? []).some(e => {
  const o = nodes.get(e.to);
  return o && o.key === key && o.floor === floor;
});

// ── 3b. 지도에 계단이 표기되지 않은 건물(도서관, 후관 3층 기숙사 등)은
//        위아래 층에서 가장 가까운 칸끼리 이어 내부 계단으로 간주한다.
[...bars.keys()].forEach(k => {
  const key = k.slice(0, k.lastIndexOf('#'));
  const floor = +k.slice(k.lastIndexOf('#') + 1);
  if (floor === 0) return;
  const upper = bars.get(k), lower = bars.get(`${key}#${floor - 1}`);
  if (!lower || upper.some(c => linkedTo(c, key, floor - 1))) return;

  let a = null, b = null, bestD = Infinity;
  upper.forEach(u => lower.forEach(l => {
    const d = Math.hypot(u.pos.x - l.pos.x, u.pos.z - l.pos.z);
    if (d < bestD) { bestD = d; a = u; b = l; }
  }));
  if (a) link(a.id, b.id, 2.4, 'stair');
});

// ── 4. 건물 사이 연결 통로. 통로 노드를 사이에 두고 양끝 건물에 붙이므로
//      "아고라까지 가는 길"도 따로 안내할 수 있다.
//      연결복도·경사로·아고라는 계단이 아니라 통로이므로 수단을 적지 않는다
//      (적으면 계단 없는 경로에서 이 길들까지 피해 버린다).
//      돌출 부속실(중앙 계단탑)도 후보이므로 bars 가 아니라 navCells 를 훑는다.
function endCell({ key, floor, at: [x, z], kind, room }) {
  let best = null, bestD = Infinity;
  navCells.forEach(c => {
    if (c.key !== key || c.floor !== floor) return;
    if (kind && c.kind !== kind) return;
    if (room && !c.room.includes(room)) return;
    const d = (c.pos.x - x) ** 2 + (c.pos.z - z) ** 2;
    if (d < bestD) { bestD = d; best = c; }
  });
  return best;
}
CONNECTORS.forEach(c => c.ends.forEach(end => {
  const cell = endCell(end);
  if (cell) link(c.id, cell.id, 1.15, end.via ?? null);
}));

// ── 4b. 한 건물을 여러 덩어리로 나눠 만든 곳은 내부에서 서로 이어 준다
//        (담곡관은 서쪽 부속실 열과 동쪽 홀이 별도 블록이다)
[
  [['dgW', 0, 47.9, 26], ['dgE', 0, 53.9, 26]],
].forEach(([a, b]) => {
  const A = nearestCell(...a), B = nearestCell(...b);
  if (A && B) link(A.id, B.id);
});

// ── 4c. 통로 몸체를 통로 노드에 물려 클릭으로 고를 수 있게 한다.
//        (아고라는 교실이자 통로라 "여기로 가자"의 대상이 된다)
Object.entries(connectorMeshes).forEach(([id, mesh]) => {
  mesh.userData.node = nodes.get(id);
  pickables.push(mesh);
});

// ── 5. 야외 보행로 + 건물 출입구
OUT_LINKS.forEach(([a, b]) => link(a, b));

function nearestOutdoor(pos) {
  let best = null, bestD = Infinity;
  OUTDOOR.forEach(([id]) => {
    const d = nodes.get(id).pos.distanceTo(pos);
    if (d < bestD) { bestD = d; best = id; }
  });
  return { id: best, d: bestD };
}
navCells.forEach(c => {
  if (c.floor !== 0) return;
  // 현관은 언제나 출입구, 1층 계단은 건물 끝의 비상 출입구로 취급
  if (c.kind !== 'entry' && c.kind !== 'stair') return;
  const { id, d } = nearestOutdoor(c.pos);
  if (d < 45) link(c.id, id, c.kind === 'entry' ? 1 : 1.4);
});

// ── 5b. 현관도 계단도 표기되지 않은 건물(도서관·창고·문화관 등)이 고립되지
//        않도록, 야외에 가장 가까운 1층 칸 하나를 출입구로 삼는다.
const outdoorIds = new Set(OUTDOOR.map(([id]) => id));
new Set(navCells.filter(c => c.floor === 0).map(c => c.key)).forEach(key => {
  const cells = bars.get(`${key}#0`) ?? [];
  const hasDoor = cells.some(c =>
    (adj.get(c.id) ?? []).some(e => outdoorIds.has(e.to)));
  if (hasDoor) return;

  let best = null, bestOut = null, bestD = Infinity;
  cells.forEach(c => {
    const { id, d } = nearestOutdoor(c.pos);
    if (d < bestD) { bestD = d; best = c; bestOut = id; }
  });
  if (best) link(best.id, bestOut, 1.2);
});

/* ── Dijkstra ─────────────────────────────────────────────────────
   opts.viaDorm  === true → 기숙사 가중치를 빼고 순수 최단 경로를 구한다.
   opts.stepFree === true → 계단 대신 승강기로 층을 오르내린다.

   승강기는 평소 학생이 타고 다니는 것이 아니므로 기본값에서는 큰 비용을 물려
   사실상 쓰지 않게 하고, "계단 없는 경로"를 켜면 반대로 계단에 그 비용을 옮긴다.
   막지 않고 비싸게만 만드는 이유는 기숙사와 같다 — 승강기가 없는 건물(별관·후관
   등)에서도 길이 끊기지 않아야 하고, 그때는 안내에 계단이 있다고 알려 주면 된다. */
const AVOID_COST = 60;

function findPath(startId, goalId, opts = {}) {
  const dorm  = opts.viaDorm ? 1 : RESTRICTED_COST;
  const stair = opts.stepFree ? AVOID_COST : 1;
  const elev  = opts.stepFree ? 1 : AVOID_COST;
  const climbCost = v => v === 'stair' ? stair : v === 'elev' ? elev : 1;

  /* 기숙사 가중치는 "지나다니지 마라"는 뜻이지 "가지 마라"가 아니다. 출발지나
     도착지가 기숙사면 거기 닿는 간선까지 30배를 물게 되어, 정작 기숙사로 갈 때
     엉뚱하게 먼 길을 고르게 된다. 그래서 양 끝점에 걸린 간선은 면제한다. */
  const transit = id => nodes.get(id).restricted && id !== startId && id !== goalId;

  const dist = new Map([[startId, 0]]);
  const prev = new Map();
  const done = new Set();
  const queue = [[0, startId]];

  while (queue.length) {
    queue.sort((a, b) => a[0] - b[0]);
    const [d, id] = queue.shift();
    if (done.has(id)) continue;
    done.add(id);
    if (id === goalId) break;
    for (const { to, w, via } of adj.get(id) ?? []) {
      if (done.has(to)) continue;
      const restricted = (transit(id) || transit(to)) ? dorm : 1;
      const nd = d + w * restricted * climbCost(via);
      if (nd < (dist.get(to) ?? Infinity)) {
        dist.set(to, nd); prev.set(to, { from: id, via }); queue.push([nd, to]);
      }
    }
  }
  if (!done.has(goalId)) return null;

  const ids = [goalId];
  const climbs = [];                      // 실제로 쓴 층 이동 수단
  while (prev.has(ids[0])) {
    const step = prev.get(ids[0]);
    if (step.via) climbs.push(step.via);
    ids.unshift(step.from);
  }
  const path = ids.map(id => nodes.get(id));

  // 계단·제한구역 가중치가 섞인 탐색 비용 대신 실제 이동 거리를 보고한다
  let length = 0;
  for (let i = 1; i < path.length; i++) length += path[i - 1].pos.distanceTo(path[i].pos);
  return {
    path, length, cost: dist.get(goalId),
    usedStairs: climbs.includes('stair'),
    usedElev:   climbs.includes('elev'),
  };
}

/* ── 경로 렌더링 ──────────────────────────────────────────────── */
const routeGroup = new THREE.Group();
scene.add(routeGroup);

/* 경로는 방 상자 "안쪽"을 지나므로 그냥 그리면 건물에 완전히 가려진다.
   depthTest 를 꺼서 언제나 건물 위에 겹쳐 그리고, 동시에 건물을 반투명으로
   바꿔(투시 모드) 경로가 어느 층을 지나는지 눈으로 따라갈 수 있게 한다. */
function routeMaterial(color) {
  return new THREE.MeshBasicMaterial({
    color, depthTest: false, depthWrite: false, transparent: true, opacity: 0.98,
  });
}

function clearRoute() {
  routeGroup.traverse(o => {
    o.geometry?.dispose?.();
    o.material?.dispose?.();
  });
  routeGroup.clear();
  refresh();
}

function drawRoute(cells) {
  clearRoute();
  const pts = cells.map(c => c.pos.clone());
  if (pts.length < 2) return;

  const curve = new THREE.CatmullRomCurve3(pts, false, 'catmullrom', 0.25);

  // 굵은 외곽선 + 밝은 심지 두 겹으로 그려 어떤 배경에서도 눈에 띄게 한다
  [[0.95, 0x1e3a8a, 998], [0.6, TONE.sel, 999]].forEach(([r, col, order]) => {
    const tube = new THREE.Mesh(
      new THREE.TubeGeometry(curve, Math.max(64, pts.length * 10), r, 10, false),
      routeMaterial(col)
    );
    tube.renderOrder = order;
    tube.userData.isRoute = true;
    routeGroup.add(tube);
  });

  // 각 경유 지점에 작은 구슬을 찍어 이동 방향을 읽기 쉽게 한다
  pts.slice(1, -1).forEach(p => {
    const bead = new THREE.Mesh(new THREE.SphereGeometry(0.85, 14, 10), routeMaterial(0xbfdbfe));
    bead.position.copy(p);
    bead.renderOrder = 1000;
    bead.userData.isRoute = true;
    routeGroup.add(bead);
  });

  const marker = (p, color, text, cls) => {
    const m = new THREE.Mesh(new THREE.SphereGeometry(1.7, 20, 14), routeMaterial(color));
    m.position.copy(p);
    m.renderOrder = 1001;
    m.userData.isRoute = true;
    routeGroup.add(m);

    // 지면까지 내려오는 기둥 — 경로가 몇 층에 있는지 한눈에 보이게
    const drop = new THREE.Mesh(
      new THREE.CylinderGeometry(0.16, 0.16, p.y, 6), routeMaterial(color)
    );
    drop.position.set(p.x, p.y / 2, p.z);
    drop.renderOrder = 997;
    drop.userData.isRoute = true;
    routeGroup.add(drop);

    const t = makeLabel(text, cls);
    t.position.copy(p).add(new THREE.Vector3(0, 3.4, 0));
    routeGroup.add(t);
  };
  marker(pts[0], 0x16a34a, '출발', 'pin start');
  marker(pts[pts.length - 1], 0xdc2626, '도착', 'pin end');

  refresh();
}

/* ══════════════════════════════════════════════════════════════════
   UI
   ══════════════════════════════════════════════════════════════════ */
// 접기/펼치기 — 각 섹션 제목을 누르면 본문이 접힌다
document.querySelectorAll('.cap.click').forEach(c => {
  c.onclick = () => c.parentElement.classList.toggle('closed');
});

const showRooms = document.getElementById('showRooms');
const showSite  = document.getElementById('showSite');
const xrayBox   = document.getElementById('xray');
showRooms.onchange = showSite.onchange = xrayBox.onchange = () => refresh();

/* ── 층 선택 ──────────────────────────────────────────────────
   전체(null) 또는 본관의 한 개 층. 층을 고르면 그 층만 또렷하게 남기고
   나머지 층·다른 건물은 반투명으로 물러난다. */
let floorFocus = null;

const floorsBox = document.getElementById('floors');
const roomsPerFloor = [0, 0, 0, 0];
navCells.forEach(c => {
  if (c.key === 'main' && c.kind !== 'stair' && c.kind !== 'elev') roomsPerFloor[c.floor]++;
});

const floorBtns = [];
[['전체', null], ['1층', 0], ['2층', 1], ['3층', 2], ['4층', 3]].forEach(([nm, idx]) => {
  const b = document.createElement('button');
  b.className = 'floor';
  const n = idx === null ? roomsPerFloor.reduce((s, v) => s + v, 0) : roomsPerFloor[idx];
  b.innerHTML = `<span class="nm"></span><span class="ct">${n}실</span>`;
  b.querySelector('.nm').textContent = nm;
  b.onclick = () => setFloor(idx);
  floorsBox.appendChild(b);
  floorBtns.push({ b, idx });
});

function setFloor(idx) {
  floorFocus = idx;
  floorBtns.forEach(f => f.b.classList.toggle('on', f.idx === idx));
  refresh();
}

/* ── 건물 보기 ────────────────────────────────────────────── */
const focusBox = document.getElementById('focus');
Object.keys(focusTargets).filter(k => k.includes('.')).forEach(name => {
  const b = document.createElement('button');
  b.className = 'chip';
  b.textContent = name.replace(/^\d+\.\s*/, '');   // "1. 본관" → "본관"
  b.onclick = () => flyTo(focusTargets[name]);
  focusBox.appendChild(b);
});

/* ── 표현 갱신 ────────────────────────────────────────────────
   층 강조 · 경로 투시 · 선택 강조가 서로 덮어쓰지 않도록, 세 가지를 모두
   여기서 한 번에 계산해 각 상자의 불투명도를 다시 정한다. */
function refresh() {
  const xray = xrayBox.checked && routeGroup.children.length > 0;

  parts.forEach(p => {
    const lit = floorFocus === null || (p.key === 'main' && p.floor === floorFocus);

    if (p.type === 'label') {
      p.o.visible = showRooms.checked && lit;
      return;
    }
    let k = p.sel ? 1 : lit ? 1 : 0.13;
    if (xray && !p.sel) k = Math.min(k, 0.24);

    // 모든 표면이 이미 transparent 이므로 여기서는 opacity 만 만진다 (surface 참고)
    const m = p.o.material;
    m.opacity = p.base * k;
    m.depthWrite = m.opacity > 0.99;
  });

  siteObjects.forEach(o => { o.visible = showSite.checked; });
}

/* ── 시설 상자 클릭 ───────────────────────────────────────────
   드래그로 화면을 돌린 경우와 구분해야 하므로 눌렀다 뗀 거리로 판정한다. */
const hint = document.getElementById('hint');
const raycaster = new THREE.Raycaster();
const ptr = new THREE.Vector2();
let selected = null, downAt = null, hoverAt = 0;

function pickAt(ev) {
  ptr.set(ev.clientX / innerWidth * 2 - 1, -(ev.clientY / innerHeight * 2 - 1));
  raycaster.setFromCamera(ptr, camera);
  return raycaster.intersectObjects(pickables.filter(m => m.visible), false)[0]?.object ?? null;
}

function select(mesh) {
  if (selected) {
    const prev = partOf.get(selected);
    selected.material.color.setHex(prev.tone);
    prev.sel = false;
  }
  selected = mesh;
  if (selected) {
    const p = partOf.get(selected);
    selected.material.color.setHex(TONE.sel);
    p.sel = true;
  }
  const here = selected?.userData.node?.bldg ?? '1. 본관';
  Object.entries(bldgLabels).forEach(([k, el]) => el.classList.toggle('on', k === here));
  showHint();
  refresh();
}

function showHint() {
  const node = selected?.userData.node;
  if (!node) { hint.textContent = '시설 상자를 클릭해 보세요'; return; }
  hint.innerHTML =
    `<div class="nm"></div><div class="meta"></div>
     <div class="pa"><button data-t="from">출발지로</button><button data-t="to">도착지로</button></div>`;
  hint.querySelector('.nm').textContent = node.room;
  // 연결통로·야외는 층 개념이 없다 (아고라는 이름 안에 2.5층이 이미 들어 있다)
  hint.querySelector('.meta').textContent =
    (node.kind === 'connector' || node.kind === 'outdoor')
      ? node.bldg : `${node.bldg} · ${node.floor + 1}층`;
  hint.querySelectorAll('button').forEach(b => b.onclick = () => {
    const label = labelOf.get(node.id);
    if (!label) return;
    (b.dataset.t === 'from' ? fromIn : toIn).value = label;
    document.getElementById('secNav').classList.remove('closed');
  });
}

renderer.domElement.addEventListener('pointerdown', e => {
  downAt = { x: e.clientX, y: e.clientY };
});
renderer.domElement.addEventListener('pointerup', e => {
  if (!downAt) return;
  const moved = Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y);
  downAt = null;
  if (moved > 5) return;                     // 회전 조작이었다
  select(pickAt(e));
});
renderer.domElement.addEventListener('pointermove', e => {
  if (downAt || performance.now() - hoverAt < 70) return;
  hoverAt = performance.now();
  renderer.domElement.style.cursor = pickAt(e) ? 'pointer' : '';
});

bldgLabels['1. 본관']?.classList.add('on');   // 기본 강조는 본관
setFloor(null);

/* ── 길찾기 UI ────────────────────────────────────────────────── */
// 사람이 읽는 이름 -> 노드 id.  같은 이름(화장실·계단 등)이 여러 개이므로
// "건물 층 교실" 형태로 유일하게 만든다.
const placeList = [];
const placeIndex = new Map();
const labelOf = new Map();          // 노드 id -> 사람이 읽는 이름 (상자 클릭용)
nodes.forEach(n => {
  // 야외 지점과 연결통로는 층 개념이 없으므로 이름을 그대로 쓴다
  if (n.kind === 'outdoor' || n.kind === 'connector') place(n.room, n.id);
  else place(`${n.bldg} ${n.floor + 1}층 ${n.room}`, n.id);
});
function place(label, id) {
  let unique = label, i = 2;
  while (placeIndex.has(unique)) unique = `${label} (${i++})`;
  placeIndex.set(unique, id);
  labelOf.set(id, unique);
  placeList.push(unique);
}
placeList.sort((a, b) => a.localeCompare(b, 'ko'));
document.getElementById('places').innerHTML =
  placeList.map(p => `<option value="${p.replace(/"/g, '&quot;')}">`).join('');

const fromIn = document.getElementById('fromIn');
const toIn   = document.getElementById('toIn');
const steps  = document.getElementById('steps');

/* 사용자가 "3-1"처럼 짧게 쳐도 찾아준다: 정확 일치 → 부분 일치 순. */
function resolve(text) {
  const q = text.trim();
  if (!q) return null;
  if (placeIndex.has(q)) return placeIndex.get(q);
  const lower = q.toLowerCase();
  const hits = placeList.filter(p => p.toLowerCase().includes(lower));
  if (!hits.length) return null;
  // 교실 이름이 통째로 일치하는 것을 우선
  const exact = hits.find(p => p.split(' ').pop().toLowerCase() === lower);
  return placeIndex.get(exact ?? hits[0]);
}

document.getElementById('go').onclick = () => {
  const a = resolve(fromIn.value), b = resolve(toIn.value);
  steps.style.display = 'block';
  if (!a || !b) {
    steps.innerHTML = `<div class="warn">${!a ? '출발지' : '도착지'}를 찾을 수 없습니다. 목록에서 골라 주세요.</div>`;
    clearRoute();
    return;
  }
  if (a === b) {
    steps.innerHTML = '<div class="warn">출발지와 도착지가 같습니다.</div>';
    clearRoute();
    return;
  }
  const viaDorm  = document.getElementById('viaDorm').checked;
  const stepFree = document.getElementById('stepFree').checked;
  const res = findPath(a, b, { viaDorm, stepFree });
  if (!res) {
    steps.innerHTML = '<div class="warn">연결된 경로를 찾지 못했습니다.</div>';
    clearRoute();
    return;
  }

  setFloor(null);                            // 경로가 층 강조에 가려지지 않도록
  drawRoute(res.path);

  // 같은 건물·같은 층이 이어지는 구간은 한 줄로 묶어 안내한다
  const legs = [];
  res.path.forEach(n => {
    const where = n.kind === 'outdoor'   ? '야외'
                : n.kind === 'connector' ? '연결통로'
                : `${n.bldg} ${n.floor + 1}층`;
    const last = legs[legs.length - 1];
    if (last && last.where === where) last.rooms.push(n.room);
    else legs.push({ where, rooms: [n.room] });
  });

  const throughDorm = res.path.some(n => n.restricted) &&
                      !nodes.get(a).restricted && !nodes.get(b).restricted;

  /* 계단 없는 경로를 요청했는데도 계단이 섞였다면, 그 구간에 승강기가 아예
     없다는 뜻이다. 조용히 계단을 안내하면 헛걸음을 시키므로 반드시 알린다. */
  const notes = [];
  if (throughDorm) notes.push('이 경로는 기숙사를 지나갑니다.');
  if (stepFree && res.usedStairs)
    notes.push('이 구간에는 엘리베이터가 없어 계단을 지납니다. 도움이 필요할 수 있습니다.');
  else if (stepFree && res.usedElev) notes.push('엘리베이터를 이용하는 경로입니다.');
  else if (res.usedElev) notes.push('이 경로는 엘리베이터를 이용합니다.');

  steps.innerHTML =
    `<div class="sum">총 이동거리 약 ${Math.round(res.length)} m · ${legs.length}개 구간</div>` +
    notes.map(n => `<div class="note">${n}</div>`).join('') +
    '<ol>' +
    legs.map(l => {
      const via = l.rooms.length > 2
        ? `${l.rooms[0]} → … → ${l.rooms[l.rooms.length - 1]}`
        : l.rooms.join(' → ');
      return `<li><b>${l.where}</b><br>${via}</li>`;
    }).join('') + '</ol>';

  // 경로 전체가 보이도록 카메라를 맞춘다
  const box = new THREE.Box3().setFromPoints(res.path.map(n => n.pos));
  const c = box.getCenter(new THREE.Vector3());
  const r = Math.max(box.getSize(new THREE.Vector3()).length(), 30);
  fly = { t: 0, fromT: controls.target.clone(), toT: c,
          fromC: camera.position.clone(),
          toC: c.clone().add(new THREE.Vector3(0, r * 0.75, r * 0.95)) };
};

document.getElementById('clear').onclick = () => {
  clearRoute();
  select(null);
  steps.style.display = 'none';
  fromIn.value = toIn.value = '';
};
document.getElementById('swap').onclick = () => {
  [fromIn.value, toIn.value] = [toIn.value, fromIn.value];
};
[fromIn, toIn].forEach(el => el.addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('go').click();
}));

let fly = null;
function flyTo(target) {
  const offset = new THREE.Vector3(0, 34, 52);
  fly = { t: 0, fromT: controls.target.clone(), toT: target.clone(),
          fromC: camera.position.clone(), toC: target.clone().add(offset) };
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});

/* ══════════════════════════════════════════════════════════════════
   LOOP
   ══════════════════════════════════════════════════════════════════ */
function tick() {
  requestAnimationFrame(tick);

  if (fly) {
    fly.t = Math.min(1, fly.t + 0.04);
    const e = 1 - Math.pow(1 - fly.t, 3);            // ease-out cubic
    controls.target.lerpVectors(fly.fromT, fly.toT, e);
    camera.position.lerpVectors(fly.fromC, fly.toC, e);
    if (fly.t >= 1) fly = null;
  }

  // fade room captions out when the camera pulls back, so the overview stays clean
  // — 멀리서는 건물 이름표만 남아야 배치가 읽힌다
  const dist = camera.position.distanceTo(controls.target);
  const opacity = dist > 116 ? 0 : dist > 74 ? (116 - dist) / 42 : 1;
  roomLabels.forEach(l => { l.element.style.opacity = opacity; });

  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
tick();
</script>
</body>
</html>
